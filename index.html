<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUTTER FEET TYCOON RAHHHH!</title>
    
    <link rel="icon" type="image/png" href="Ori.png.png">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Arial Black', sans-serif;
        }

        /* THE BACKGROUND IMAGE */
        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('Gemini_Generated_Image_8jl8vv8jl8vv8jl8 (1).png');
            background-size: cover;
            background-position: center;
            z-index: 1;
            filter: contrast(1.2) brightness(1.1);
        }

        /* THE PARTICLE LAYER */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10;
            pointer-events: none;
        }

        /* OVERLAY TEXT FOR VIBES */
        #ra-text {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: white;
            font-size: 2rem;
            z-index: 5;
            text-shadow: 2px 2px 10px red;
            opacity: 0.5;
            user-select: none;
        }
    </style>
</head>
<body onclick="startCalm()">

    <div id="bg-image"></div>
    <div id="ra-text">RAHHHHHHHH!</div>
    <canvas id="particleCanvas"></canvas>

    <audio id="calmAudio" src="Tyccoon_Game.mp3" loop></audio>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('calmAudio');
        const particles = [];
        const particleImg = new Image();
        
        // THE PARTICLE IMAGE
        particleImg.src = 'Gemini_Generated_Image_8jl8vv8jl8vv8jl8 (1).png';

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 60 + 30; // BIGGER PARTICLES RAHHH
                this.speedX = Math.random() * 6 - 3;
                this.speedY = Math.random() * 6 - 3;
                this.rotation = Math.random() * 360;
                this.rotSpeed = Math.random() * 5 + 2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotSpeed;

                if (this.x > canvas.width + 50) this.x = -50;
                if (this.x < -50) this.x = canvas.width + 50;
                if (this.y > canvas.height + 50) this.y = -50;
                if (this.y < -50) this.y = canvas.height + 50;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.globalAlpha = 0.8;
                ctx.drawImage(particleImg, -this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        function init() {
            for (let i = 0; i < 40; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        // INTERACTION FUNCTION
        function startCalm() {
            audio.play().catch(e => console.log("RAHHH! Click again!"));
            alert("you have been calmed!");
        }

        // LOAD AND RUN
        particleImg.onload = () => {
            init();
            animate();
        };

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
